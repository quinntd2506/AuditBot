services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: auditbot-api
    restart: always
    ports:
      - "8001:8001"
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./.codex:/app/.codex
      - ./api:/app/api:ro
      - ./init_db.py:/app/init_db.py:ro

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: auditbot-worker
    restart: always
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./.codex:/app/.codex                          # app state (guardian tokens, repos, uploads)
      - ${HOME}/.codex:/root/.codex:ro                # Codex CLI auth.json (read-only)
      - ./worker:/app/worker:ro
      - ./api:/app/api:ro
      - ./init_db.py:/app/init_db.py:ro

  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    container_name: auditbot-sandbox
    restart: always
    environment:
      CODEX_HOME: /root/.codex
      SANDBOX_CACHE_DIR: /cache
      SANDBOX_TEST_TIMEOUT: "1800"
      CODEX_AGENT_TIMEOUT: "3600"
      MAINNET_RPC_URL: ${MAINNET_RPC_URL:-}
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:-}
      ETH_RPC_URL: ${ETH_RPC_URL:-}
      FOUNDRY_ETH_RPC_URL: ${FOUNDRY_ETH_RPC_URL:-}
      ARBITRUM_RPC_URL: ${ARBITRUM_RPC_URL:-}
      BASE_RPC_URL: ${BASE_RPC_URL:-}
      OPTIMISM_RPC_URL: ${OPTIMISM_RPC_URL:-}
      POLYGON_RPC_URL: ${POLYGON_RPC_URL:-}
      BSC_RPC_URL: ${BSC_RPC_URL:-}
      AVALANCHE_RPC_URL: ${AVALANCHE_RPC_URL:-}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    cpus: 2.0
    read_only: true
    tmpfs:
      - /tmp
      - /sandbox
    volumes:
      - ${HOME}/.codex:/root/.codex:ro
      - auditbot_sandbox_cache:/cache
    expose:
      - "8080"
  postgres:
    image: postgres:15-alpine
    container_name: auditbot-postgres
    restart: always
    ports:
      - "5432:5432"
    env_file:
      - ../.env
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=auditbot
    volumes:
      - auditbot_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auditbot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: auditbot-redis
    restart: always
    command: ["redis-server", "--port", "6381"]
    ports:
      - "6381:6381"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6381", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  auditbot_pg_data: {}
  auditbot_sandbox_cache: {}
